name: Build Android APK + iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  # ================================================
  # JOB 1: BUILD ANDROID APK
  # ================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK (release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SGTSoftphone-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # ================================================
  # JOB 2: BUILD iOS IPA
  # ================================================
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (No CodeSign)
        run: flutter build ios --release --no-codesign

      - name: Package IPA for 3uTools / Sideloadly
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r SGTSoftphone.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SGTSoftphone-iOS-IPA
          path: build/ios/ipa/SGTSoftphone.ipa
          retention-days: 14
