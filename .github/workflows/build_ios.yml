name: Validate + Build Mobile Artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Unit and widget tests
        run: flutter test

  # ================================================
  # JOB 1: BUILD ANDROID APK
  # ================================================
  build-android:
    name: Build installable Android debug APK
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate runtime endpoint variables
        env:
          SGT_WSS_URI: ${{ vars.SGT_WSS_URI }}
          SGT_SIP_DOMAIN: ${{ vars.SGT_SIP_DOMAIN }}
        run: |
          test -n "$SGT_SIP_DOMAIN" || { echo "Missing repository variable SGT_SIP_DOMAIN"; exit 1; }
          case "$SGT_WSS_URI" in
            wss://*/ws) ;;
            *) echo "SGT_WSS_URI must match wss://host/ws"; exit 1 ;;
          esac

      - name: Build Android APK (debug-signed, internal testing only)
        env:
          SGT_WSS_URI: ${{ vars.SGT_WSS_URI }}
          SGT_SIP_DOMAIN: ${{ vars.SGT_SIP_DOMAIN }}
          SGT_TURN_URIS: ${{ vars.SGT_TURN_URIS }}
          SGT_TURN_USERNAME: ${{ vars.SGT_TURN_USERNAME }}
        run: |
          flutter build apk --debug \
            --dart-define=SGT_WSS_URI="$SGT_WSS_URI" \
            --dart-define=SGT_SIP_DOMAIN="$SGT_SIP_DOMAIN" \
            --dart-define=SGT_TURN_URIS="$SGT_TURN_URIS" \
            --dart-define=SGT_TURN_USERNAME="$SGT_TURN_USERNAME"

      - name: Verify APK output file
        run: test -f build/app/outputs/flutter-apk/app-debug.apk

      - name: Verify Gradle toolchain
        run: |
          cd android
          ./gradlew --version
          ./gradlew tasks
          cd ..

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SGTSoftphone-Android-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  # ================================================
  # JOB 2: BUILD iOS UNSIGNED IPA
  # ================================================
  build-ios:
    name: Build unsigned iOS IPA package for sideloading
    needs: validate
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate runtime endpoint variables
        env:
          SGT_WSS_URI: ${{ vars.SGT_WSS_URI }}
          SGT_SIP_DOMAIN: ${{ vars.SGT_SIP_DOMAIN }}
        run: |
          test -n "$SGT_SIP_DOMAIN" || { echo "Missing repository variable SGT_SIP_DOMAIN"; exit 1; }
          case "$SGT_WSS_URI" in
            wss://*/ws) ;;
            *) echo "SGT_WSS_URI must match wss://host/ws"; exit 1 ;;
          esac

      - name: Build iOS (Release, No CodeSign)
        env:
          SGT_WSS_URI: ${{ vars.SGT_WSS_URI }}
          SGT_SIP_DOMAIN: ${{ vars.SGT_SIP_DOMAIN }}
          SGT_TURN_URIS: ${{ vars.SGT_TURN_URIS }}
          SGT_TURN_USERNAME: ${{ vars.SGT_TURN_USERNAME }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SGT_WSS_URI="$SGT_WSS_URI" \
            --dart-define=SGT_SIP_DOMAIN="$SGT_SIP_DOMAIN" \
            --dart-define=SGT_TURN_URIS="$SGT_TURN_URIS" \
            --dart-define=SGT_TURN_USERNAME="$SGT_TURN_USERNAME"

      - name: Stage Payload directory structure
        run: |
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          test -f build/ios/ipa/Payload/Runner.app/Info.plist
          test -f build/ios/ipa/Payload/Runner.app/Runner
          test -d build/ios/ipa/Payload/Runner.app/Frameworks

      - name: Package unsigned IPA with ditto
        run: |
          cd build/ios/ipa
          ditto -c -k --sequesterRsrc --keepParent \
            Payload \
            SGTSoftphone-unsigned.ipa
          cd ../../..

      - name: Verify IPA integrity and Payload structure
        run: |
          unzip -tq build/ios/ipa/SGTSoftphone-unsigned.ipa
          archive_contents=$(unzip -l build/ios/ipa/SGTSoftphone-unsigned.ipa)
          echo "$archive_contents"
          echo "$archive_contents" | grep -F "Payload/Runner.app/Info.plist" || { echo "Missing Payload/Runner.app/Info.plist"; exit 1; }
          echo "$archive_contents" | grep -F "Payload/Runner.app/Runner" || { echo "Missing Payload/Runner.app/Runner"; exit 1; }
          echo "$archive_contents" | grep -F "Payload/Runner.app/Frameworks/" || { echo "Missing Payload/Runner.app/Frameworks/"; exit 1; }

      - name: Package dSYM symbols for crash symbolication
        run: |
          mkdir -p build/ios/dSYMs
          find build/ios/iphoneos -maxdepth 1 -name "*.dSYM" -exec cp -R {} build/ios/dSYMs/ \; || true
          cd build/ios
          zip -r dSYMs.zip dSYMs/
          cd ../..

      - name: Upload unsigned IPA artifact (Testing / Sideloadly only)
        uses: actions/upload-artifact@v4
        with:
          name: SGTSoftphone-iOS-Unsigned-IPA-for-Sideloadly
          path: build/ios/ipa/SGTSoftphone-unsigned.ipa
          retention-days: 14

      - name: Upload dSYM symbols artifact
        uses: actions/upload-artifact@v4
        with:
          name: SGTSoftphone-iOS-dSYM-Symbols
          path: build/ios/dSYMs.zip
          retention-days: 14
