<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="SGT VoIP Softphone PWA with Web Push for iOS and Web">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SGT VoIP">
  <meta name="theme-color" content="#0175C2">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SGT VoIP Softphone</title>
  <link rel="manifest" href="manifest.json">

  <!-- Web Push Helper -->
  <script src="web_push_helper.js"></script>

  <script>
    // Register custom Web Push Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        const baseHref = document.querySelector('base') ? document.querySelector('base').getAttribute('href') : '/softphone/';
        navigator.serviceWorker.register('sw.js', { scope: baseHref })
          .then(function(registration) {
            console.log('[PWA] Service Worker registered with scope:', registration.scope);
          })
          .catch(function(error) {
            console.warn('[PWA] Service Worker registration failed:', error);
          });
      });
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
